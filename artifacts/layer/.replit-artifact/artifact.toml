kind = "web"
previewPath = "/"
title = "Layer"
version = "1.0.0"
id = "artifacts/layer"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20863

[services.development]
run = "pnpm --filter @workspace/layer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/layer", "run", "build" ]
publicDir = "artifacts/layer/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20863"
BASE_PATH = "/"
