<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Rounded square background -->
  <rect width="100" height="100" rx="22" ry="22" fill="white"/>

  <!-- Circular burst pattern — 20 segments radiating from center-top -->
  <!-- Each segment is a rotated trapezoid, clipped to bottom half circle -->
  <g transform="translate(50, 52)">
    <!-- Segments at various rotations, bottom semicircle fan -->
    <g fill="black">
      <!-- segment 1 -->
      <polygon points="-2,-4 2,-4 6,38 -6,38" transform="rotate(-90)"/>
      <!-- segment 2 -->
      <polygon points="-2,-4 2,-4 7,38 -5,38" transform="rotate(-78)"/>
      <!-- segment 3 -->
      <polygon points="-2,-4 2,-4 8,36 -4,36" transform="rotate(-66)"/>
      <!-- segment 4 -->
      <polygon points="-2,-4 2,-4 9,33 -3,33" transform="rotate(-54)"/>
      <!-- segment 5 -->
      <polygon points="-2,-4 2,-4 9,28 -2,28" transform="rotate(-42)"/>
      <!-- segment 6 -->
      <polygon points="-2,-4 2,-4 8,22 -1,22" transform="rotate(-30)"/>
      <!-- segment 7 -->
      <polygon points="-2,-4 2,-4 6,15 0,15" transform="rotate(-18)"/>
      <!-- segment 8 -->
      <polygon points="-2,-4 2,-4 4,8 1,8" transform="rotate(-8)"/>
      <!-- center -->
      <polygon points="-2,-4 2,-4 3,6 -3,6" transform="rotate(0)"/>
      <!-- segment 9 -->
      <polygon points="-2,-4 2,-4 4,8 1,8" transform="rotate(8)"/>
      <!-- segment 10 -->
      <polygon points="-2,-4 2,-4 6,15 0,15" transform="rotate(18)"/>
      <!-- segment 11 -->
      <polygon points="-2,-4 2,-4 8,22 -1,22" transform="rotate(30)"/>
      <!-- segment 12 -->
      <polygon points="-2,-4 2,-4 9,28 -2,28" transform="rotate(42)"/>
      <!-- segment 13 -->
      <polygon points="-2,-4 2,-4 9,33 -3,33" transform="rotate(54)"/>
      <!-- segment 14 -->
      <polygon points="-2,-4 2,-4 8,36 -4,36" transform="rotate(66)"/>
      <!-- segment 15 -->
      <polygon points="-2,-4 2,-4 7,38 -5,38" transform="rotate(78)"/>
      <!-- segment 16 -->
      <polygon points="-2,-4 2,-4 6,38 -6,38" transform="rotate(90)"/>
      <!-- upper arc dots -->
      <polygon points="-1.5,-4 1.5,-4 3,10 -2,10" transform="rotate(-108)" opacity="0.7"/>
      <polygon points="-1.5,-4 1.5,-4 2,7 -1,7" transform="rotate(-120)" opacity="0.5"/>
      <polygon points="-1,-4 1,-4 1.5,5 -0.5,5" transform="rotate(-132)" opacity="0.3"/>
      <polygon points="-1.5,-4 1.5,-4 3,10 -2,10" transform="rotate(108)" opacity="0.7"/>
      <polygon points="-1.5,-4 1.5,-4 2,7 -1,7" transform="rotate(120)" opacity="0.5"/>
      <polygon points="-1,-4 1,-4 1.5,5 -0.5,5" transform="rotate(132)" opacity="0.3"/>
    </g>
  </g>
</svg>
